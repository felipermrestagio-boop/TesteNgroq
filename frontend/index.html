<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teste Vercel + ngrok</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 1.4rem; }
    label { font-size: .9rem; color: #555; }
    .row { display: flex; gap: 8px; margin: 12px 0; }
    input, textarea { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
    button { padding: 8px 14px; border: 0; border-radius: 6px; background: #1f6feb; color: #fff; font: inherit; cursor: pointer; }
    button.sec { background: #555; }
    #status { padding: 8px 10px; border-radius: 6px; background: #eee; font-size: .9rem; }
    .ok { background: #d9f7e1 !important; } .erro { background: #fddede !important; } .alerta { background: #fff3cd !important; }
    ul { padding: 0; list-style: none; }
    li { padding: 8px 0; border-bottom: 1px solid #eee; }
    small, a { color: #777; }
  </style>
</head>
<body>
  <h1>Teste: Vercel → ngrok → API local → SQLite</h1>

  <label for="bases">URLs da API, uma por linha (a primeira é a principal):</label>
  <div class="row">
    <textarea id="bases" rows="3"></textarea>
    <button class="sec" onclick="salvarBases()">Salvar</button>
  </div>
  <div id="status">Aguardando...</div>

  <div class="row">
    <input id="texto" placeholder="Digite uma mensagem">
    <button onclick="enviar()">Enviar</button>
  </div>

  <ul id="lista"></ul>
  <p><small><a href="disparador.html">Abrir o disparador de requisições</a></small></p>

  <script src="api.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const nome = (base) => base.replace(/^https?:\/\//, "");

    function status(msg, tipo) {
      const el = $("status");
      el.textContent = msg;
      el.className = tipo || "";
    }

    function resumo(res) {
      const via = nome(res.base);
      const failover = res.tentativas.length > 1 ? " · failover ativo" : "";
      return `${via} · ${Math.round(res.ms)} ms${failover}`;
    }

    function erroTotal(e) {
      const detalhe = (e.tentativas || []).map((t) => `${nome(t.base)}: ${t.erro}`).join(" | ");
      return detalhe ? `${e.message} (${detalhe})` : e.message;
    }

    function salvarBases() {
      API.setBases($("bases").value.split("\n"));
      API.resetar();
      testar();
    }

    async function testar() {
      try {
        const res = await API.apiFetch("/health");
        if (!res.r.ok) throw new Error("HTTP " + res.r.status);
        status("API conectada ✔ " + resumo(res), res.tentativas.length > 1 ? "alerta" : "ok");
        listar();
      } catch (e) {
        status(erroTotal(e), "erro");
      }
    }

    async function listar() {
      try {
        const res = await API.apiFetch("/mensagens");
        if (!res.r.ok) throw new Error("HTTP " + res.r.status);
        const dados = await res.r.json();
        $("lista").innerHTML = dados.map((m) =>
          `<li>${esc(m.texto)}<br><small>#${m.id} · ${esc(m.criado_em)}</small></li>`
        ).join("");
      } catch (e) {
        status("Erro ao listar: " + erroTotal(e), "erro");
      }
    }

    async function enviar() {
      const texto = $("texto").value.trim();
      if (!texto) return;
      try {
        const res = await API.apiFetch("/mensagens", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ texto })
        });
        if (!res.r.ok) throw new Error("HTTP " + res.r.status);
        $("texto").value = "";
        status("Salvo no banco local ✔ " + resumo(res), res.tentativas.length > 1 ? "alerta" : "ok");
        listar();
      } catch (e) {
        status("Erro ao salvar: " + erroTotal(e), "erro");
      }
    }

    $("bases").value = API.getBases().join("\n");
    testar();
  </script>
</body>
</html>
